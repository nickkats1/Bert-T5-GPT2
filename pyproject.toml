[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bert-t5-gpt2"
version = "0.3.0"
description = "Fine-tuning BERT, GPT-2, and T5 on news headline data."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "Nick" }]
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.0,<4",
    "scikit-learn>=1.4,<2",
    "torch>=2.2,<3",
    "transformers>=4.48,<6",
    "datasets>=3,<5",
    "accelerate>=1,<2",
    "tokenizers>=0.15,<1",
    "sentencepiece>=0.1.99,<1",
    "safetensors>=0.4,<1",
    "rouge_score>=0.1.2,<1",
    "evaluate>=0.4,<1",
]

[project.scripts]
train-bert = "headlines.bert.train:main"
train-t5 = "headlines.t5.train:main"
train-gpt2 = "headlines.gpt2.train:main"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["headlines*"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --tb=short --strict-markers --strict-config"
xfail_strict = true
norecursedirs = [".git", ".venv", "venv", "build", "dist", ".mypy_cache", ".pytest_cache", "__pycache__"]
markers = [
    "integration: cross-module/integration tests",
]

[tool.coverage.run]
source = ["headlines"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:"]
fail_under = 60

[tool.ruff]
line-length = 119
target-version = "py311"
exclude = ["venv", ".venv", "build", "dist", ".mypy_cache", ".pytest_cache", "*.ipynb"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "C4",   # flake8-comprehensions
    "RUF",  # ruff-specific
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011", "RUF001"]
"__init__.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["headlines"]
lines-after-imports = 2

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
